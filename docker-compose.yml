# Version de Docker Compose
version: '3.8'

services:
  # Service PHP/Symfony avec Apache
  app:
    # Production: on consomme l'image construite par le pipeline (IMAGE_REF)
    image: ${IMAGE_REF}
    container_name: cfe-homey-enedis-proxy-app
    ports:
      # Exposé uniquement en localhost pour le reverse proxy Nginx système
      - "127.0.0.1:8080:80"
    dns:
      # DNS OVH upstream (obtenu via resolvectl status sur l'hôte)
      # Seul ce DNS peut résoudre gw.prd.api.enedis.fr (pas les DNS publics)
      - 213.186.33.99
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_SECRET=${APP_SECRET}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_ADDRESS}:${DB_PORT}/${DB_NAME}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - enedis-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: cfe-homey-enedis-proxy-db
    environment:
      POSTGRES_DB: ${DB_NAME:-enedis_proxy}
      POSTGRES_USER: ${DB_USER:-enedis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-enedis_password}
    # Port PostgreSQL NON exposé publiquement (accès interne uniquement)
    # ports:
    #   - "5432:5432"
    volumes:
      # Persistance des données
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-enedis_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enedis-network
    restart: unless-stopped

networks:
  enedis-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
