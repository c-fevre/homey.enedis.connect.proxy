; Durcissement PHP du proxy — source unique des réglages de requête.
; Chargé par le CLI et par mod_php (même PHP_INI_DIR), ce qui permet aux tests
; de bout en bout de vérifier les valeurs effectives (tests/e2e/e2e.test.mjs).
; Aucun php_value dans le vhost Apache ni dans public/.htaccess ne doit les
; surcharger : le test e2e le vérifie aussi.

; Ne pas annoncer la version de PHP (X-Powered-By) : c'est le premier
; indicateur qu'un attaquant lit pour cibler une version vulnérable.
expose_php = Off

; php2shell (CVE-2026-109619, état global périmé) : la progression d'upload en
; session est l'un des chemins d'exploitation confirmés. Le proxy n'envoie
; jamais de fichier, la fonctionnalité est inutile ici.
session.upload_progress.enabled = Off

; php2shell (CVE-2026-109618, corruption sur épuisement mémoire) : borner la
; taille des requêtes décodées. Le proxy ne reçoit que des formulaires OAuth et
; des requêtes JSON de quelques Ko ; 8M / 2M sont les valeurs recommandées par
; l'avis de sécurité PHP du 2026-10-21 (upload_max_filesize < post_max_size).
post_max_size = 8M
upload_max_filesize = 2M

; Limite finie, volontairement : le correctif 8.2.35 rend inutile le
; memory_limit=-1 conseillé en palliatif, et une limite infinie exposerait au
; déni de service. Valeur reprise de l'ancien vhost Apache.
memory_limit = 256M
max_execution_time = 300
