<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        
        # Index par défaut
        DirectoryIndex index.php

        # Activer le FallbackResource pour Symfony (chemin relatif)
        FallbackResource index.php

        # Réécriture côté vhost (plus robuste que .htaccess)
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.php [QSA,L]
        </IfModule>
        
        # Headers pour le debug
        Header set X-Proxy-Server "Enedis-OAuth-Proxy"
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Réglages PHP : aucun php_value ici. La source unique est
    # docker/php/conf.d/zz-hardening.ini (tailles de requête bornées, upload_progress
    # désactivé, version masquée) ; un php_value la surchargerait silencieusement.

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"

    # Enedis affiche le retour de consentement dans une iframe : X-Frame-Options ne gère
    # pas de liste d'origines, on passe par CSP frame-ancestors (nous + domaines Enedis).
    Header always unset X-Frame-Options
    Header always set Content-Security-Policy "frame-ancestors 'self' https://*.enedis.fr https://*.web-enedis.fr"
</VirtualHost>
